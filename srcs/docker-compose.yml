services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file: .env
    networks: inception
    volumes: mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    env_file: .env
    networks:  inception
    depends_on: wordpress
    volumes:  wordpress_data:/var/www/html
    ports: "443:443"

networks:
  inception:
    driver: bridge
  
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress 

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
  mysql_password:
    file: ./secrets/db_password.txt
  
  