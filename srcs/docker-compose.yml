services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    env_file: 
      - .env
    networks: 
      - inception
    volumes: 
      - mariadb_data:/var/lib/mysql
    secrets:
      - wordpress_db_user_password
      - mariadb_root_password

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: unless-stopped
    env_file: 
      - .env
    networks: 
      - inception
    depends_on: 
      - mariadb
      - redis
    volumes: 
      - wordpress_data:/var/www/html
    secrets:
      - wordpress_db_user_password
      - wordpress_user_password
      - wordpress_admin_password

  nginx:
    build: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: unless-stopped
    env_file: 
      - .env
    networks: 
      - inception
    depends_on: 
      - wordpress
    volumes: 
      - wordpress_data:/var/www/html
    ports: 
      - "443:443"

  redis:
    build: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: unless-stopped
    networks:
      - inception
  ftp:
    build: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    restart: unless-stopped
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    secrets:
      - ftp_password

  adminer:
    build: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - inception
    depends_on:
      - mariadb

  static_site:
    build: ./requirements/bonus/static_site
    image: static_site
    container_name: static_site
    restart: unless-stopped
    ports:
      - "5500:5500"
    networks:
      - inception

  cadvisor:
    build: ./requirements/bonus/cadvisor
    image: cadvisor
    container_name: cadvisor
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  
networks:
  inception:
    driver: bridge
  
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress 

secrets:
  mariadb_root_password:
    file: "../secrets/mariadb_root_password.txt"
  wordpress_db_user_password:
    file: "../secrets/wordpress_db_user_password.txt"
  wordpress_admin_password:
    file: "../secrets/wordpress_admin_password.txt"
  wordpress_user_password:
    file: "../secrets/wordpress_user_password.txt"
  ftp_password:
    file: "../secrets/ftp_password.txt"