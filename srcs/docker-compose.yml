services:
  mariadb:
    build: ./requirements/mariadb
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wp_user
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_password
      - db_root_password

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/aid-bray/data/mysql

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
  mysql_password:
    file: ./secrets/db_password.txt
  
  